<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hooklet - Webhook Capture & Replay Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-go.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
            canvas: { 
              950: '#000000',
              900: '#0a0a0a',
              850: '#121212',
              800: '#1c1c1c',
              750: '#262626',
              700: '#333333' 
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-canvas-950 text-slate-200 h-screen overflow-hidden flex flex-col font-sans antialiased select-none">

  {{ template "header" . }}

  <div class="flex-1 min-h-0 flex overflow-hidden">
    {{ template "sidebar" . }}
    {{ template "inspector" . }}
  </div>

  {{ template "simulate_modal" . }}
  {{ template "snippet_modal" . }}
  {{ template "edit_replay_modal" . }}
  {{ template "clear_confirm_modal" . }}

  <div id="toast" class="fixed bottom-5 right-5 px-4 py-2.5 rounded-lg bg-canvas-900 border border-canvas-750 shadow-2xl text-xs font-mono text-white flex items-center gap-2 transform transition-all duration-300 translate-y-16 opacity-0 z-50">
    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
    <span id="toast-message">Notification</span>
  </div>

  <script src="/static/js/highlight.js"></script>
  <script src="/static/js/sse.js"></script>
  <script src="/static/js/modals.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
