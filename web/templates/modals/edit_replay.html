{{ define "edit_replay_modal" }}
<div id="modal-edit-replay" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center hidden">
  <div class="bg-canvas-900 border border-canvas-750 rounded-xl w-[700px] max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
    <div class="p-4 border-b border-canvas-800 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="edit-3" class="w-4 h-4 text-blue-400"></i>
        <div>
          <div class="flex items-center gap-2">
            <h3 class="text-sm font-bold text-white">Edit & Replay Webhook</h3>
            <span id="edit-modal-path-badge" class="text-[10px] bg-canvas-800 text-blue-400 px-1.5 py-0.2 rounded font-mono">/wh/github</span>
          </div>
          <p class="text-[11px] text-slate-400">Modify headers or JSON body before dispatching to destination server</p>
        </div>
      </div>
      <button onclick="closeEditReplayModal()" class="text-slate-400 hover:text-white transition">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <div class="p-5 overflow-y-auto space-y-4 text-xs font-mono">
      <div class="grid grid-cols-4 gap-3">
        <div>
          <label class="text-slate-400 font-sans block mb-1">HTTP Method</label>
          <select id="edit-method" class="w-full bg-canvas-950 border border-canvas-800 rounded px-2.5 py-1.5 text-emerald-400 font-bold">
            <option value="POST">POST</option>
            <option value="GET">GET</option>
            <option value="PUT">PUT</option>
            <option value="PATCH">PATCH</option>
            <option value="DELETE">DELETE</option>
          </select>
        </div>
        <div class="col-span-3">
          <label class="text-slate-400 font-sans block mb-1">Target URL</label>
          <input type="text" id="edit-target-url" class="w-full bg-canvas-950 border border-canvas-800 rounded px-2.5 py-1.5 text-slate-200" />
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-slate-400 font-sans">Request Headers</label>
          <button onclick="addEditHeaderRow('', '')" class="text-blue-400 hover:text-blue-300 transition text-[11px] flex items-center gap-1 font-sans">
            <i data-lucide="plus" class="w-3 h-3"></i>
            <span>Add Header</span>
          </button>
        </div>
        <div id="edit-headers-container" class="space-y-1.5 max-h-40 overflow-y-auto p-1"></div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="text-slate-400 font-sans">Request Payload Body</label>
          <button onclick="formatEditBody()" class="text-blue-400 hover:text-blue-300 transition text-[11px]">Format JSON</button>
        </div>
        <textarea id="edit-payload-body" rows="6" class="w-full bg-canvas-950 border border-canvas-800 rounded p-2.5 text-blue-300 font-mono text-xs focus:outline-none focus:border-blue-500"></textarea>
      </div>
    </div>

    <div class="p-4 border-t border-canvas-800 bg-canvas-950 flex items-center justify-between">
      <button onclick="closeEditReplayModal()" class="px-4 py-1.5 rounded border border-canvas-750 text-slate-400 hover:text-white transition text-xs font-sans">Cancel</button>
      <button onclick="submitCustomReplay()" class="px-4 py-1.5 rounded bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs font-sans transition flex items-center gap-1.5 shadow">
        <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
        <span>Execute Custom Replay</span>
      </button>
    </div>
  </div>
</div>
{{ end }}
