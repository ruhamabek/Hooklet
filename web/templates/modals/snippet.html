{{ define "snippet_modal" }}
<div id="modal-snippet" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center hidden">
  <div class="bg-canvas-900 border border-canvas-750 rounded-xl w-[650px] max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
    <div class="p-4 border-b border-canvas-800 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="terminal" class="w-4 h-4 text-blue-400"></i>
        <div>
          <h3 class="text-sm font-bold text-white">Export & Replay Snippet</h3>
          <p class="text-[11px] text-slate-400">Execute this exact webhook payload from CLI or automation scripts</p>
        </div>
      </div>
      <button onclick="closeSnippetModal()" class="text-slate-400 hover:text-white transition">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <div class="px-4 pt-3 border-b border-canvas-800 flex items-center justify-between text-xs">
      <div class="flex items-center gap-1">
        <button onclick="setSnippetLang('curl')" id="snip-tab-curl" class="px-3 py-1.5 rounded-t font-medium bg-blue-600 text-white">cURL (Bash)</button>
        <button onclick="setSnippetLang('js')" id="snip-tab-js" class="px-3 py-1.5 rounded-t font-medium text-slate-400 hover:text-white">JavaScript / Fetch</button>
        <button onclick="setSnippetLang('python')" id="snip-tab-python" class="px-3 py-1.5 rounded-t font-medium text-slate-400 hover:text-white">Python Requests</button>
        <button onclick="setSnippetLang('go')" id="snip-tab-go" class="px-3 py-1.5 rounded-t font-medium text-slate-400 hover:text-white">Go (net/http)</button>
      </div>
      <button onclick="copySnippetCode()" class="text-blue-400 hover:text-blue-300 transition flex items-center gap-1 text-[11px] pb-1.5">
        <i data-lucide="copy" class="w-3 h-3"></i>
        <span>Copy Code</span>
      </button>
    </div>

    <div class="p-4 flex-1 overflow-hidden">
      <pre class="bg-black border border-canvas-800 rounded-lg p-4 font-mono text-xs overflow-auto h-72 leading-relaxed"><code id="snippet-code" class="language-bash"></code></pre>
    </div>

    <div class="p-3 border-t border-canvas-800 bg-canvas-950 flex justify-end">
      <button onclick="closeSnippetModal()" class="px-4 py-1.5 rounded bg-canvas-800 text-slate-200 hover:text-white text-xs font-medium">Done</button>
    </div>
  </div>
</div>
{{ end }}
