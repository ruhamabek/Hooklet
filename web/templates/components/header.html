{{ define "header" }}
<header class="bg-canvas-900 border-b border-canvas-800 px-5 py-2.5 flex items-center justify-between z-10">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/20 text-white">
      <i data-lucide="zap" class="w-4 h-4 fill-white"></i>
    </div>
    <div>
      <div class="flex items-center gap-2">
        <span class="font-bold tracking-wider text-sm text-white uppercase">HOOKLET</span>
        <span class="text-[10px] bg-canvas-800 text-blue-400 border border-blue-500/30 px-1.5 py-0.2 rounded font-mono font-semibold">v0.1</span>
      </div>
      <p class="text-[11px] text-slate-400">Webhook Capture & Replay</p>
    </div>
  </div>

  <div class="flex items-center gap-4 text-xs">
    <div class="flex items-center gap-2 px-3 py-1.5 rounded-md bg-canvas-850 border border-canvas-800">
      <span class="text-slate-400">Listener:</span>
      <span class="text-emerald-400 font-mono font-medium">/wh/*</span>
      <button onclick="copyIngressUrl()" class="ml-1 text-slate-400 hover:text-white transition flex items-center gap-1 text-[11px]" title="Copy full ingress URL">
        <i data-lucide="copy" class="w-3 h-3"></i>
        <span>Copy Ingress</span>
      </button>
    </div>

    <div class="flex items-center gap-2 px-3 py-1 rounded-md bg-canvas-850 border border-canvas-800">
      <span class="text-emerald-400 flex h-2 w-2 relative">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
      </span>
      <span class="text-slate-400">Target:</span>
      <input type="text" id="global-target" value="http://localhost:8000/webhook" 
             class="bg-transparent text-slate-200 font-mono text-xs w-64 focus:outline-none border-b border-transparent focus:border-blue-500 transition px-1" />
    </div>
  </div>

  <div class="flex items-center gap-2 text-xs">
    <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-950/60 border border-emerald-800 text-emerald-400 font-mono text-[11px]">
      <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
      <span id="live-indicator">LIVE CAPTURE</span>
    </div>

    <button onclick="openSimulateModal()" class="px-3 py-1.5 rounded-md bg-canvas-850 hover:bg-canvas-800 border border-canvas-750 text-slate-200 hover:text-white transition flex items-center gap-1.5 font-medium">
      <i data-lucide="play" class="w-3.5 h-3.5 text-blue-400"></i>
      <span>Simulate Feed</span>
    </button>

    <button onclick="openSimulateModal()" class="px-3.5 py-1.5 rounded-md bg-blue-600 hover:bg-blue-500 text-white transition flex items-center gap-1.5 font-medium shadow-sm">
      <i data-lucide="plus" class="w-3.5 h-3.5"></i>
      <span>New Test Request</span>
    </button>

    <button onclick="exportRequestsJSON()" class="p-1.5 rounded-md bg-canvas-850 hover:bg-canvas-800 border border-canvas-750 text-slate-400 hover:text-white transition" title="Export all requests as JSON">
      <i data-lucide="download" class="w-3.5 h-3.5"></i>
    </button>

    <button onclick="clearAllRequests()" class="p-1.5 rounded-md bg-canvas-850 hover:bg-rose-950/60 border border-canvas-750 hover:border-rose-800 text-slate-400 hover:text-rose-400 transition" title="Clear all requests">
      <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
    </button>
  </div>
</header>
{{ end }}
